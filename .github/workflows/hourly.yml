name: Cat Duke Hourly

on:
  schedule:
    - cron: "20 * * * *"

  workflow_dispatch:

concurrency:
  group: cat-duke-hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    timeout-minutes: 8

    container:
        image: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run automation
        env:
          CAT_DUKE_PIN: ${{ secrets.CAT_DUKE_PIN }}

          TARGET_NAME: 山大王

          THROW_COUNT: 100

          # 每次間隔 1 秒
          CLICK_GAP_MS: 1000

        run: npm start

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_number }}
          path: |
            error.png
            after-target-click.png
            target-coordinate-error.png
            throw-panel.png
            throw-error.png
            no-throw-control.png
          if-no-files-found: ignore
          retention-days: 3